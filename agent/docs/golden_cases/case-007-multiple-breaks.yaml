human_analysis:
  important_observations:
    - "完整三日窗口共有 14 条平台线索和 11 条私信，但有效线索、触达、成交和收入均缺失。"
    - "plan-b-07 连续三日消耗 367.75、获得 105 次点击但没有平台线索；plan-b-08 已有 6 条线索和 5 条私信。"
    - "两个问题同时存在：计划层的前端转化差异，以及账户层后端质量数据缺口。"
  likely_diagnosis:
    - "plan-b-07 值得进入计划层漏斗复核，但仅凭前端 0 线索不能解释为素材、定向或承接的确定原因。"
    - "账户不能依据 228.5714 的平台 CPL 放量，因为有效线索成本和 ROI 均不可计算。"
  content_review_needed: false
  strategy_direction:
    - "先保留三日分层对照，并补齐有效线索与触达回传；在质量缺口关闭前不扩大预算。"
    - "对 plan-b-07 做承接链路和计划配置核验，后续动作只作为建议，不执行后台变更。"
  cannot_conclude:
    - "没有素材正文，不能调用内容审查或归因到 Hook、承诺与合规。"
    - "没有有效线索和成交数据，不能判断真实获客成本、ROI 或是否应暂停计划。"

expected_behavior:
  should_call: [supervisor, data_analysis, ads_diagnosis, strategy]
  should_not_call: [content_review]
  acceptable_routes:
    - "supervisor -> data_analysis -> supervisor -> ads_diagnosis -> supervisor -> strategy -> supervisor -> finish"
  forbidden_outputs: [budget_change, bid_change, pause_plan, scale_percentage, execution_status, backend_action, guaranteed_roi]
