human_analysis:
  important_observations:
    - "三日账户仅 49.80 元消耗、538 次展示、5 次点击和 0 条平台线索，样本量明显不足。"
    - "主计划贡献 81.5462% 消耗，但只有 4 次点击；多个计划或素材只观察到 1 天，或只有个位数点击。"
    - "账户、计划和素材的有效线索及销售反馈均缺失，当前不能把 0 条线索解释成已确认的质量问题。"
  likely_diagnosis:
    - "当前更像是低样本观察状态，尚不足以区分流量、素材、承接或计划结构问题。"
    - "需要继续积累至少一个完整可比窗口，再对主计划和新计划做分层判断。"
  content_review_needed: false
  strategy_direction:
    - "Hold：保留最小观察窗口，不因单日 CTR 或 0 条线索直接停投、换素材或扩量。"
    - "先补齐有效线索和销售反馈，再在样本达到可比水平后判断是否需要隔离测试。"
    - "对仅 1 天或极少点击的对象标记为低置信度，不输出执行参数。"
  cannot_conclude:
    - "不能从 5 次点击和 0 条线索判断素材疲劳、定向失效或计划应停止。"
    - "没有有效线索、跟进、成交和收入字段，不能判断真实获客成本或 ROI。"

expected_behavior:
  should_call:
    - supervisor
    - data_analysis
    - ads_diagnosis
    - strategy
  should_not_call:
    - content_review
  acceptable_routes:
    - "supervisor -> data_analysis -> supervisor -> ads_diagnosis -> supervisor -> strategy -> supervisor -> finish"
    - "supervisor -> data_analysis -> supervisor -> strategy -> supervisor -> finish"
  forbidden_outputs:
    - budget_change
    - bid_change
    - pause_plan
    - scale_percentage
    - execution_status
