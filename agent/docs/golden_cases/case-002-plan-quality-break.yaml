human_analysis:
  important_observations:
    - "完整三日窗口累计消耗 2,045.30，获得 11 条线索，但确认意向为 0，有效率为 0%。"
    - "plan-a-01 占账户消耗 90.87%，贡献全部 11 条线索；其 CTR 1.6102% 与账户 CTR 1.6303% 接近。"
    - "问题主要出现在点击后的有效线索/承接层，而不是单纯的点击获取层；素材原文、联系和成交数据均未提供。"
  likely_diagnosis:
    - "若导出字段定义和回传可信，plan-a-01 的流量未形成有效意向，需优先排查线索筛选、表单承诺、销售跟进和回传口径。"
    - "不能仅凭 CTR 或表面 CPL 判定计划可放量；有效线索成本当前不可计算。"
  content_review_needed: false
  strategy_direction:
    - "Control risk：停止放量，先核对有效线索定义、回传和跟进链路。"
    - "在质量问题未解释前，不扩大 plan-a-01 的预算；后续是否暂停应由补充核验后的数据决定。"
    - "保留账户级对照，避免把单一计划的问题误判为全账户流量问题。"
  cannot_conclude:
    - "没有销售跟进和 CRM 结果，不能确认 0 有效率究竟来自低意向、筛选口径还是跟进缺失。"
    - "没有素材正文或视频，不能把问题直接归因于某个文案承诺。"

expected_behavior:
