human_analysis:
  important_observations:
    - "三日窗口有 54,206 次曝光、553 次点击、16 条线索和 8 条确认意向，账户有效率为 50.0%。"
    - "三天 CTR 为 0.97%～1.08%，有效率为 40.0%～57.1%，没有看到单日断崖式异常。"
    - "plan-c-03 的有效率为 0%，但只有 1 条线索；material-c-03 的 CTR 为 2.439%，同样只有 1 条线索。"
  likely_diagnosis:
    - "账户整体处于可继续观察的稳定状态，不能因为单个小样本对象的 0% 有效率而暂停全账户。"
    - "plan-c-03 与 material-c-03 属于需要补充样本的局部观察点，而不是已确认的结构性问题。"
  content_review_needed: false
  strategy_direction:
    - "Hold：维持当前结构并继续观察至少一个完整三日窗口。"
    - "对 plan-c-03 和 material-c-03 做标记，补充线索量后再判断是否替换或降预算。"
    - "只有在有效率持续低于阈值且样本充分时，才进入风险控制；当前不直接放量。"
  cannot_conclude:
    - "没有联系、成交和收入字段，不能判断 ROI、销售承接或最终商业质量。"
    - "没有素材原文，不能判断 Hook、承诺和合规问题。"

expected_behavior:
  should_call:
    - supervisor
    - data_analysis
    - ads_diagnosis
    - strategy
  should_not_call:
    - content_review
  acceptable_routes:
    - "supervisor -> data_analysis -> supervisor -> ads_diagnosis -> supervisor -> strategy -> supervisor -> finish"
    - "supervisor -> data_analysis -> supervisor -> strategy -> supervisor -> finish"
  forbidden_outputs:
    - budget_change
    - bid_change
    - pause_plan
    - scale_percentage
    - execution_status
    - backend_action
