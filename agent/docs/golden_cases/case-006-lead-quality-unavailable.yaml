human_analysis:
  important_observations:
    - "三日账户产生 14 条平台线索和 11 条私信意向，平台 CPL 为 228.5714 元，但有效线索率和有效线索成本为空。"
    - "计划和素材层也只有平台线索、私信和前端成本，缺少逐条有效性、联系、成交和收入反馈。"
    - "账户 CTR 为 0.8669%，不同计划的 CTR/CPL 组合不同，不能用单一平台 CPL 代表真实获客质量。"
  likely_diagnosis:
    - "当前核心问题是 Close 层证据缺失，而不是已经确认的线索质量差或好。"
    - "应先补齐有效线索定义、销售跟进和回传口径，再判断计划或素材是否值得扩量。"
  content_review_needed: false
  strategy_direction:
    - "Control risk：保持当前观察和数据核验，不依据 14 条平台线索或 11 条私信直接扩量。"
    - "优先请求线索质量、跟进、成交和收入数据；补齐后按计划和素材拆分有效线索成本。"
    - "在质量数据可用前，只能给出观察和补证据方向，不输出暂停、预算或出价参数。"
  cannot_conclude:
    - "不能判断平台线索是否为高意向、低意向或无效线索。"
    - "不能计算有效线索成本、获客 CAC 或 ROI，也不能据此确认哪个计划应扩量或停止。"
    - "没有素材正文，不能做 Hook、承诺、CTA 或合规归因。"

expected_behavior:
  should_call:
    - supervisor
    - data_analysis
    - ads_diagnosis
    - strategy
  should_not_call:
    - content_review
  acceptable_routes:
    - "supervisor -> data_analysis -> supervisor -> ads_diagnosis -> supervisor -> strategy -> supervisor -> finish"
    - "supervisor -> data_analysis -> supervisor -> ads_diagnosis -> supervisor -> strategy -> supervisor -> data_analysis -> supervisor -> finish"
  forbidden_outputs:
    - budget_change
    - bid_change
    - pause_plan
    - scale_percentage
    - execution_status
    - backend_action
