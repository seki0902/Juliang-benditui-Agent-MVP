human_analysis:
  important_observations:
    - "账户整体三日有效率为 43.3071%，高于 40% 风险线，但 plan-b-01 有 5 条线索、0 条确认意向。"
    - "plan-b-01 CTR 为 1.9791%，约为账户 CTR 的 1.91 倍；material-b-01 CTR 为 1.7007%，但有效率仅 20.0%。"
    - "material-b-01 的表面 CPL 为 118.453，但有效线索成本为 592.265，约为账户有效线索成本的 1.87 倍。"
  likely_diagnosis:
    - "这是点击层表现较好、有效线索层明显变差的漏斗断点，可能涉及低意向人群吸引、承诺与承接不一致，或后续筛选/跟进口径。"
    - "账户整体不应被一刀切暂停；应隔离 plan-b-01 与 material-b-01，和稳定质量对象做对照。"
  content_review_needed: true
  strategy_direction:
    - "Control risk：不对 plan-b-01 或 material-b-01 放量，先核验素材承诺、表单筛选和有效线索回传。"
    - "保留账户级稳定对象作为对照；若低有效率在补充窗口持续，优先替换或降权该方向。"
    - "内容审核只能基于补充的真实视频/口播文本，不能从素材名反推文案。"
  cannot_conclude:
    - "没有视频、口播稿和逐条销售反馈，不能判断究竟是 Hook、承诺、定向还是跟进造成低有效率。"
    - "账户整体有 43.3071% 有效率，不能把局部对象直接外推为全账户失效。"

