human_analysis:
  important_observations:
    - "三日账户共消耗 315.04 元、65 次点击和 1 条平台线索；主计划占 82.6308% 消耗。"
    - "material-e-01 消耗 118.01 元、1190 次展示、16 次点击、0 条线索，属于可定位的素材层异常候选。"
    - "当前没有 material-e-01 的视频、口播稿或字幕，不能从素材名称反推内容问题。"
  likely_diagnosis:
    - "可能存在点击后承接、承诺与目标人群不匹配，或素材本身的转化路径不清，但目前只能作为待验证假设。"
    - "应把内容审查限定在 material-e-01，不应把单一素材候选外推为全账户结论。"
  content_review_needed: true
  strategy_direction:
    - "Control risk：先补充 material-e-01 的真实内容和承接信息，再决定是否重做素材或隔离测试。"
    - "在有效线索和后端反馈缺失时保持小范围观察，不因 CTR 或平台 CPL 直接扩量。"
    - "若无法补齐素材内容，输出内容层无法判断，并把后续动作限定为补证据。"
  cannot_conclude:
    - "不能判断问题一定来自 Hook、承诺、CTA、定向或销售跟进。"
    - "没有有效线索、联系、成交和收入字段，不能判断真实获客成本或 ROI。"

