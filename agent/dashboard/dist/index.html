<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="本地推运营 Agent 的运行进度、执行记录与日报结果"><title>Agent 运行台 · 本地推</title><link rel="stylesheet" href="/style.css"></head>
<body><aside class="rail"><div class="logo">A<span>·</span></div><div class="rail-label">运行台</div><div class="rail-foot">LOCAL<br>GROWTH</div></aside>
<main><header><div><p class="eyebrow">LOCAL GROWTH / OPERATIONS</p><h1>Agent 运行台</h1><p class="muted">本地推日报 · 下载、分析与同步记录</p></div><div class="live"><span id="connection">正在连接本地服务</span><div class="actions"><button id="run-agent" class="run-action" title="立即执行当前日报流程"><span aria-hidden="true">▶</span><span id="run-agent-label">立即运行 Agent</span></button><button id="refresh">刷新记录 ↻</button></div><span id="run-feedback" class="run-feedback" role="status" aria-live="polite"></span></div></header>
<div id="error" class="error" role="alert" hidden></div>
<section class="overview"><article class="primary"><div class="card-label">最新一次运行 <span id="latest-date">—</span></div><h2 id="latest-status">正在读取</h2><p id="latest-summary">读取本机真实运行记录…</p><div id="freshness" class="footnote"></div></article><article><div class="card-label">下一次自动运行</div><h2 id="next-run">—</h2><p id="schedule-info">正在核实 Windows 任务</p><span class="footnote" id="schedule-detail"></span></article><article><div class="card-label">最近运行</div><h2 id="success-count">—</h2><p id="history-count">成功 / 部分完成 / 失败</p><div id="spark" class="spark" aria-label="最近运行状态"></div></article></section>
<section class="workspace"><div class="history-panel"><div class="section-head"><h2>运行记录</h2><span id="run-count" class="muted"></span></div><label class="filter-label" for="filter">筛选状态</label><select id="filter"><option value="all">全部状态</option><option value="success">成功</option><option value="partial">部分完成</option><option value="failed">失败 / 中断</option><option value="running">运行中</option></select><div id="runs" aria-label="运行记录列表"></div></div>
<article class="detail"><div class="section-head"><div><p class="eyebrow" id="detail-date">RUN DETAILS</p><h2>执行详情</h2></div><span id="detail-status" class="badge">—</span></div><p id="detail-meta" class="muted"></p><div id="failure" class="error" hidden></div><div id="steps" class="timeline"></div><div id="result" hidden><div class="section-head result-head"><h2>这次产出了什么</h2><span id="report-date" class="muted"></span></div><div id="metrics" class="metrics"></div><div id="receipts" class="receipts"></div><div id="artifacts" class="artifacts"></div><details><summary>阅读完整日报</summary><pre id="report"></pre></details></div><p id="empty-result" class="muted"></p></article></section>
<footer><span>数据来自本机日志、运行记录及真实回执 · 每 5 秒刷新</span><span id="updated">—</span></footer></main><script src="/app.js"></script></body></html>
